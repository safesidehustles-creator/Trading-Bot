name: Security and fork tests

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ETHEREUM_RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Check formatting
        run: forge fmt --check
      - name: Run unit and fixed-block mainnet-fork tests
        run: forge test -vvv
      - name: Inspect deployed bytecode size
        run: forge build --sizes
