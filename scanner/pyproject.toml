[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jaytradingbot-scanner"
version = "0.1.0"
description = "Read-only arbitrage opportunity scanner and simulator"
requires-python = ">=3.11"
dependencies = [
  "web3>=7.0,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
jay-scan = "jaytradingbot_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["jaytradingbot_scanner*"]
exclude = ["fixtures*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
